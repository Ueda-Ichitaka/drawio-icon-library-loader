# drawio-libs settings.
#
# Lines starting with # are comments. Paths may use ~ and $VARIABLES; relative paths
# are relative to this file.

[general]
# The flatpak application id of draw.io.
app_id = com.jgraph.drawio.desktop

# When a directory holds the same library in several formats (Foo.xml, Foo.drawio,
# Foo.drawio.xml) only the first format listed here is loaded. Only these formats
# are picked up from directories.
prefer = .drawiolib, .xml, .drawio

[libraries]
# One entry per line: a library file, or a directory whose library files are all
# loaded (not its subdirectories). Libraries appear in the sidebar's "More Shapes"
# list in the order they are loaded.
#
# ~/icons/My Icons.xml
# ~/icons/all-my-libraries
